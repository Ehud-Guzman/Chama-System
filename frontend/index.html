<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content` lets the on-screen keyboard shrink the
         viewport instead of covering the bottom of a form (Chromium; Safari already
         resizes). Zoom is deliberately left enabled: pinch-to-read is how a member
         on a 5-inch phone reads a passbook, and blocking it is not our call. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#166534" />
    <meta
      name="description"
      content="Wazo Moja Self-Help Group — weekly contributions, fines and passbooks for members."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Add to Home Screen: iOS ignores an SVG apple-touch-icon and needs a PNG,
         and Android wants a maskable one so the mark is not cropped into a circle
         with a white ring around it. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Wazo Moja" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Shown when a link is pasted into the group's WhatsApp, which is how most
         members will ever meet this site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wazo Moja Self-Help Group" />
    <meta property="og:title" content="Wazo Moja Self-Help Group" />
    <meta property="og:description" content="Check your contributions, passbook and standing." />
    <meta property="og:url" content="https://wazomojashg.co.ke" />
    <title>Wazo Moja SHG</title>
    <!-- The splash: what a phone on a slow link sees instead of a blank page.
         Inline and self-contained on purpose — it cannot wait for the bundle's stylesheet, its
         font or any request at all, because the moment it would need them is the moment it is
         already too late to be useful. Colours are copied from index.css by hand for the same
         reason: that file arrives with the bundle.

         The group's name and tagline are inside the logo itself, so nothing here repeats them. -->
    <style>
      #splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem;
        /* White, because the logo is drawn on white: on the app's own canvas the JPEG would show
           as a grey-edged rectangle behind the mark. */
        background-color: #ffffff;
        color: #1b2b24;
        font-family: 'Archivo Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      #splash img {
        width: min(78vw, 320px);
        height: auto;
        animation: splash-breathe 2.4s ease-in-out infinite;
      }
      #splash p {
        margin: 0;
        font-size: 0.8125rem;
        line-height: 1.5;
        color: #5c6b62;
      }
      #splash .splash-slow {
        max-width: 20rem;
      }
      #splash button {
        min-height: 44px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background-color: #166534;
        color: #ffffff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
      }
      /* The rules above set `display` on these elements, so `hidden` needs to win over them. */
      #splash [hidden] {
        display: none !important;
      }
      @keyframes splash-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.82;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Taken down by src/App.jsx once React has committed its first screen. -->
    <div id="splash" role="status" aria-label="Opening Wazo Moja">
      <img
        src="/Logo/Wazo%20Moja%20logo.jpeg"
        alt="Wazo Moja Self-Help Group"
        width="320"
        height="213"
        fetchpriority="high"
      />
      <p>Opening your books…</p>
      <!-- If the bundle never arrives — no signal, or a deploy caught mid-request — the splash would
           otherwise sit here for ever with nothing to say. It says something, and then offers the
           one action that helps. -->
      <p class="splash-slow" id="splash-slow" hidden>
        Still opening. On a slow connection this can take a moment — if nothing happens, check your
        signal and try again.
      </p>
      <button id="splash-retry" type="button" hidden onclick="location.reload()">Try again</button>
    </div>
    <div id="root"></div>
    <script>
      // Plain inline script, because the escape hatch has to work when nothing else has loaded.
      (function () {
        var slow = document.getElementById('splash-slow');
        var retry = document.getElementById('splash-retry');
        setTimeout(function () {
          if (slow) slow.hidden = false;
        }, 7000);
        setTimeout(function () {
          if (retry) retry.hidden = false;
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
